buildscript
{
    repositories
    {
        //maven { url = 'https://files.minecraftforge.net/maven' }
        maven { url = 'https://maven.minecraftforge.net' }

        //jcenter()
        mavenCentral()
    }

    dependencies
    {
        //classpath 'net.minecraftforge.gradle:ForgeGradle:3+'
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.53', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'

repositories
{
    flatDir
    {
        dir 'libs'
    }
}

group = "${modgroup}"
version = "${modversion}"
archivesBaseName = "${modname}-${mcversion}"
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'


minecraft
{
    mappings channel: 'stable', version: '39-1.12'
    //makeObfSourceJar = false
    //accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs
    {
        client
        {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods
            {
                floralis
                {
                    source sourceSets.main
                }
            }
        }

        server
        {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods
            {
                floralis
                {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies
{
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    compileOnly 'libs:CodeChickenLib:1.12.2-3.2.3.358:universal'
    compileOnly 'libs:CoFHCore:1.12.2-4.6.6.1:universal'
    compileOnly 'libs:CoFHWorld:1.12.2-1.4.0.1:universal'
    compileOnly 'libs:forestry_1.12.2:5.8.2.427'
    compileOnly 'libs:ImmersiveEngineering:0.12-98'
    compileOnly 'libs:industrialforegoing:1.12.2:1.12.13-237'
    compileOnly 'libs:RedstoneFlux:1.12-2.1.1.1:universal'
    compileOnly 'libs:ThermalExpansion:1.12.2-5.5.7.1:universal'
    compileOnly 'libs:ThermalFoundation:1.12.2-2.6.7.1:universal'
}

processResources
{
    inputs.property "modversion", project.version
    inputs.property "mcversion", version
    filesMatching('mcmod.info')
    {
        expand 'modversion': project.version
    }
}

jar.finalizedBy('reobfJar')

sourceSets
{
    main
    {
        output.resourcesDir = output.classesDirs.singleFile
    }
}

// ========== JSON MINIFIER ==========
afterEvaluate {
    processResources {
        doLast {
            def outputDir = destinationDir ?: outputs.files.singleFile
            fileTree(dir: outputDir, include: ['**/*.json','**/*.mcmeta']).each { file ->
                try {
                    file.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(file))
                } catch (Exception ignore) {}
            }
        }
    }
}
